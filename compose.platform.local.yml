# Local-only v2 stack. Host-facing ports are loopback-bound; never expose them to a LAN/router.
x-platform-environment: &platform-environment
  PLATFORM_DATABASE_URL: postgresql://${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@database:5432/${PLATFORM_DB_NAME}
  PLATFORM_AUTH_SECRET: ${PLATFORM_AUTH_SECRET:?Run npm run platform:local:init first}
  PLATFORM_REDIS_URL: redis://:${PLATFORM_REDIS_PASSWORD:?Run npm run platform:local:init first}@redis:6379/0
  PLATFORM_S3_ENDPOINT: http://storage:9000
  PLATFORM_S3_PUBLIC_ENDPOINT: http://127.0.0.1:9001
  PLATFORM_S3_BUCKET: ${PLATFORM_S3_BUCKET:-vision-media}
  PLATFORM_S3_REGION: us-east-1
  PLATFORM_S3_ACCESS_KEY_ID: ${PLATFORM_S3_ACCESS_KEY_ID:?Run npm run platform:local:init first}
  PLATFORM_S3_SECRET_ACCESS_KEY: ${PLATFORM_S3_SECRET_ACCESS_KEY:?Run npm run platform:local:init first}
  PLATFORM_HOST: 0.0.0.0
  PLATFORM_PORT: "4400"
  PLATFORM_REGISTRATION_ENABLED: "0"
  PLATFORM_UPLOADS_ENABLED: "0"
  PLATFORM_UPLOAD_MAX_BYTES: "209715200"
  NODE_ENV: production

services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${PLATFORM_DB_NAME:?Run npm run platform:local:init first}
      POSTGRES_USER: ${PLATFORM_DB_USER:?Run npm run platform:local:init first}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?Run npm run platform:local:init first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - platform-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${PLATFORM_REDIS_PASSWORD:?Run npm run platform:local:init first}"]
    environment:
      PLATFORM_REDIS_PASSWORD: ${PLATFORM_REDIS_PASSWORD:?Run npm run platform:local:init first}
    volumes:
      - platform-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${PLATFORM_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9002"]
    environment:
      MINIO_ROOT_USER: ${PLATFORM_S3_ACCESS_KEY_ID:?Run npm run platform:local:init first}
      MINIO_ROOT_PASSWORD: ${PLATFORM_S3_SECRET_ACCESS_KEY:?Run npm run platform:local:init first}
    volumes:
      - platform-miniodata:/data
    ports:
      - "127.0.0.1:9001:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    image: vision-platform-local:dev
    build:
      context: .
      dockerfile: Dockerfile.platform
    environment: *platform-environment
    ports:
      - "127.0.0.1:4400:4400"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4400/api/v2/health').then((r) => { if (!r.ok) process.exitCode = 1; }).catch(() => { process.exitCode = 1; })"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  worker:
    image: vision-platform-local:dev
    command: ["node", "services/api/src/platform/worker-start.js"]
    environment:
      <<: *platform-environment
      PLATFORM_WORKER_HEALTH_PORT: "4401"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4401/health').then((r) => { if (!r.ok) process.exitCode = 1; }).catch(() => { process.exitCode = 1; })"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  platform-pgdata: {}
  platform-redisdata: {}
  platform-miniodata: {}
