[package]
name = "vision-server"
version = "0.1.1"
description = "Vision Server — запуск сервера и админка"
authors = ["Vision"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "vision_server_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
