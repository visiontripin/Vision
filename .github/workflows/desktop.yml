name: Desktop (Tauri)

# Собирает десктопное приложение (тот же web-бандл + Rust-оболочка Tauri 2).
#
#   pull_request / push → проверка, что Rust собирается, и артефакт .deb/.AppImage
#   git tag desktop-v0.3.0 && git push origin desktop-v0.3.0 → GitHub Release
#   (тег ставить на merge-коммит main, см. docs/RELEASES.md)
#
# Локально Rust собирается той же командой: npm --prefix apps/desktop run build:linux

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tauri CLI разбирает CI как bool: '1' роняет сборку с «invalid value '1' for '--ci'»
  CI: 'true'

jobs:
  linux:
    name: Десктоп Linux (.deb + .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Зависимости WebKitGTK и GTK
        timeout-minutes: 20
        run: |
          # Сборка падала не из-за кода: шаг висел 10+ минут на блокировке dpkg
          # (unattended-upgrades) и на медленных зеркалах. Порядок такой:
          #   1) если пакеты уже есть в образе — ничего не делаем;
          #   2) `apt-get update` — необязательный: индексы в образе уже есть,
          #      а именно update чаще всего и залипает;
          #   3) install с таймаутом блокировки и всей команды, три попытки.
          if pkg-config --exists webkit2gtk-4.1 && pkg-config --exists gtk+-3.0; then
            echo "::notice::WebKitGTK и GTK уже есть в образе — установка не нужна"
            exit 0
          fi
          # Раннеры GitHub живут в Azure: публичные зеркала archive.ubuntu.com
          # из них отвечают медленно или не отвечают вовсе. Внутреннее зеркало
          # Azure доступно всегда, поэтому переключаем источники на него.
          if [ -w /etc/apt/sources.list ]; then
            sudo sed -i -E 's|https?://(archive|security)\.ubuntu\.com|http://azure.archive.ubuntu.com|g' \
              /etc/apt/sources.list || true
          fi
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            sudo sed -i -E 's|https?://(archive|security)\.ubuntu\.com|http://azure.archive.ubuntu.com|g' "$f" || true
          done
          APT_OPTS=(-o Acquire::http::Timeout=20 -o Acquire::Retries=2
                    -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=90)
          timeout 180 sudo apt-get "${APT_OPTS[@]}" update \
            || echo "::warning::apt-get update не прошёл — пробую install по индексам из образа"
          for attempt in 1 2 3; do
            if timeout 420 sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
                 libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
                 librsvg2-dev patchelf libssl-dev libfuse2; then
              echo "::notice::зависимости GTK/WebKit установлены (попытка $attempt)"
              exit 0
            fi
            echo "::warning::apt install не сработал (попытка $attempt), повторяю"
            sleep 10
          done
          echo "::error::Не удалось поставить зависимости WebKitGTK/GTK за три попытки"
          exit 1

      - name: Web-бандл и Node-зависимости
        run: |
          npm ci
          npm --prefix apps/desktop install --no-audit --no-fund

      # Подпись включается только при наличии секретов: `pubkey: ""` в
      # репозитории + `createUpdaterArtifacts` валят `tauri build` на PR.
      - name: Подпись обновлений (если есть ключ)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: node scripts/enable-updater-signing.mjs

      - name: Сборка (cargo + tauri bundler)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          cd apps/desktop
          if ! npx tauri build --bundles deb,appimage > /tmp/desktop-build.log 2>&1; then
            echo "::error::Сборка Tauri упала — ниже ошибки компилятора"
            grep -nE '^(error(\[[A-Za-z0-9]+\])?:|error: could not)' -A 5 /tmp/desktop-build.log \
              | head -120 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -n 40 /tmp/desktop-build.log
            exit 1
          fi
          tail -n 12 /tmp/desktop-build.log

      - name: Проверка артефактов
        run: |
          set -uo pipefail
          ls -lh apps/desktop/src-tauri/target/release/bundle/deb/ || true
          ls -lh apps/desktop/src-tauri/target/release/bundle/appimage/ || true
          test -n "$(ls -A apps/desktop/src-tauri/target/release/bundle/deb/*.deb 2>/dev/null)" \
            || { echo "::error::.deb не собрался"; exit 1; }
          echo "::notice::$(ls apps/desktop/src-tauri/target/release/bundle/deb/*.deb | xargs -n1 basename | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: vision-desktop-linux
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Release (только по тегу desktop-v*)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Vision Audio Desktop ${tag#desktop-}" \
            --notes "Десктопное приложение Vision Audio ${tag#desktop-}: тот же интерфейс, что в вебе, плюс системный трей, глобальные медиа-клавиши и автообновление. Для Windows установщик лежит в том же релизе."
          # Явный список, а не шаблоны: `gh release upload` падает, если хотя бы один
          # аргумент не совпал с файлом (например, .tar.gz для updater собирается
          # только при наличии ключа подписи). Нет ключа — публикуем .deb/.AppImage.
          bundle="apps/desktop/src-tauri/target/release/bundle"
          files=()
          for f in "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage \
                   "$bundle"/appimage/*.AppImage.tar.gz "$bundle"/appimage/*.AppImage.tar.gz.sig; do
            [ -f "$f" ] && files+=("$f")
          done
          [ ${#files[@]} -gt 0 ] || { echo "::error::нечего публиковать"; exit 1; }
          gh release upload "$tag" --clobber "${files[@]}"
          gh release view "$tag" --json assets --jq '.assets[] | "asset: \(.name) \(.size) байт"'

      - name: Манифест обновлений (latest.json)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#desktop-v}"
          bundle="apps/desktop/src-tauri/target/release/bundle"
          artifact="$(basename "$(ls "$bundle"/appimage/*.AppImage.tar.gz 2>/dev/null | head -1)" || true)"
          if [ -z "$artifact" ]; then
            echo "::warning::Нет артефакта updater — latest.json не публикуется"
            exit 0
          fi
          node scripts/make-update-manifest.mjs \
            --version "$version" \
            --tag "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file CHANGELOG.md \
            --out latest.json \
            --platform "linux-x86_64=${bundle}/appimage/${artifact}:${bundle}/appimage/${artifact}.sig" || exit 0
          gh release upload "$tag" latest.json --clobber
          echo "::notice::latest.json опубликован для ${version}"

  windows:
    name: Десктоп Windows (.msi + .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Web-бандл и Node-зависимости
        run: |
          npm ci
          npm --prefix apps/desktop install --no-audit --no-fund
      - name: Подпись обновлений (если есть ключ)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: node scripts/enable-updater-signing.mjs

      - name: Сборка установщика
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! (cd apps/desktop && npx tauri build --bundles msi,nsis) > build.log 2>&1; then
            echo "::error::Сборка Tauri упала — ниже ошибки компилятора"
            grep -iE "error(\[[A-Za-z0-9]+\])?:|panicked|could not|failed to" build.log \
              | head -20 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -n 30 build.log
            exit 1
          fi
          tail -n 8 build.log

      # Authenticode: сертификат приходит секретом (base64 .pfx). Без него
      # установщик остаётся неподписанным — это честнее самоподписанного,
      # который приучает игнорировать предупреждение SmartScreen.
      - name: Подпись установщика (если есть сертификат)
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # `secrets.*` нельзя использовать в if: GitHub не даёт их в условии
          if [ -z "${CERT_BASE64:-}" ]; then
            echo "::notice::Сертификата нет — установщик остаётся неподписанным (SmartScreen предупредит)"
            exit 0
          fi
          echo "$CERT_BASE64" | base64 -d > cert.pfx
          find apps/desktop/src-tauri/target/release/bundle -name "*.exe" -o -name "*.msi" | while read -r file; do
            signtool sign /f cert.pfx /p "$CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$file" \
              || { echo "::error::Не удалось подписать $file"; exit 1; }
          done
          rm -f cert.pfx

      # `find ... | xargs ls` в Git Bash падал с кодом 123 (пути с обратными
      # слэшами), поэтому проверяем каталоги бандлера напрямую.
      - name: Артефакты
        shell: bash
        run: |
          set -uo pipefail
          bundle="apps/desktop/src-tauri/target/release/bundle"
          ls -lh "$bundle/msi" || true
          ls -lh "$bundle/nsis" || true
          test -n "$(ls -A "$bundle"/msi/*.msi 2>/dev/null)" \
            || { echo "::error::.msi не собрался"; exit 1; }
          echo "::notice::$(ls "$bundle"/msi/*.msi | xargs -n1 basename | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: vision-desktop-windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Release (только по тегу desktop-v*)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Vision Audio Desktop ${tag#desktop-}" \
            --notes "Десктопное приложение Vision Audio ${tag#desktop-}."
          # NSIS-установщика может не быть (собираем msi,nsis — но шаг не должен
          # падать из-за отсутствия одного из форматов)
          files=()
          for f in apps/desktop/src-tauri/target/release/bundle/msi/*.msi \
                   apps/desktop/src-tauri/target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] && files+=("$f")
          done
          [ ${#files[@]} -gt 0 ] || { echo "::error::нечего публиковать"; exit 1; }
          gh release upload "$tag" --clobber "${files[@]}"

      - name: Манифест обновлений для Windows
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#desktop-v}"
          bundle="apps/desktop/src-tauri/target/release/bundle"
          artifact="$(basename "$(ls "$bundle"/nsis/*.nsis.zip 2>/dev/null | head -1)" || true)"
          if [ -z "$artifact" ]; then
            echo "::warning::Нет updater-артефакта для Windows — манифест не публикуется"
            exit 0
          fi
          node scripts/make-update-manifest.mjs \
            --version "$version" --tag "$tag" --repo "${GITHUB_REPOSITORY}" \
            --notes-file CHANGELOG.md --out latest-windows.json \
            --platform "windows-x86_64=${bundle}/nsis/${artifact}:${bundle}/nsis/${artifact}.sig" || exit 0
          # Windows и Linux публикуют манифест в один релиз: сливаем платформы
          gh release download "$tag" -p latest.json -O latest-linux.json --clobber 2>/dev/null || true
          if [ -f latest-linux.json ]; then
            node -e '
              const fs = require("node:fs");
              const linux = JSON.parse(fs.readFileSync("latest-linux.json", "utf8"));
              const win = JSON.parse(fs.readFileSync("latest-windows.json", "utf8"));
              linux.platforms = { ...linux.platforms, ...win.platforms };
              fs.writeFileSync("latest.json", JSON.stringify(linux, null, 2) + "\\n");
            '
          else
            mv latest-windows.json latest.json
          fi
          gh release upload "$tag" latest.json --clobber
          echo "::notice::latest.json обновлён платформой windows-x86_64"
