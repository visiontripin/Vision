name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, JSDoc typecheck and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API contract tests
        run: npm test
      - name: Local client tests
        run: npm run test:local
      - name: Script and workflow guards
        run: npm run test:scripts
      - name: Check generated OpenAPI client types
        run: npm run check:api-types
      - name: Check API JavaScript with JSDoc types
        run: npm run typecheck:api
      - name: Web TypeScript check and build
        run: npm run build

  mobile:
    name: Android client typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Mobile TypeScript check
        run: npx tsc --noEmit

  platform-integration:
    name: Platform integration (PostgreSQL, Redis, MinIO)
    needs: [test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vision_platform_ci
          POSTGRES_USER: vision_platform
          POSTGRES_PASSWORD: vision-platform-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vision_platform -d vision_platform_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PLATFORM_DATABASE_URL: postgresql://vision_platform:vision-platform-ci-password@127.0.0.1:5432/vision_platform_ci
      PLATFORM_AUTH_SECRET: ci-postgres-integration-secret-32-bytes-minimum
      PLATFORM_REDIS_URL: redis://127.0.0.1:6379/0
      PLATFORM_S3_BUCKET: vision-platform-ci
      PLATFORM_S3_ACCESS_KEY_ID: vision-ci
      PLATFORM_S3_SECRET_ACCESS_KEY: vision-ci-secret-very-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Start private MinIO test service
        shell: bash
        run: |
          set -euo pipefail
          if ! container_output="$(docker run --detach --name vision-minio-ci --publish 127.0.0.1::9000 --env MINIO_ROOT_USER=vision-ci --env MINIO_ROOT_PASSWORD=vision-ci-secret-very-long minio/minio:RELEASE.2025-04-22T22-12-26Z server /data --console-address :9001 2>&1)"; then
            container_output="${container_output//$'\n'/ }"
            echo "::error title=MinIO container startup failed::${container_output}"
            exit 1
          fi
          container_id="$container_output"
          port="$(docker port "$container_id" 9000/tcp | awk -F: 'NR == 1 {print $NF}')"
          if [[ ! "$port" =~ ^[0-9]+$ ]]; then
            echo 'Could not determine MinIO host port.' >&2
            docker port "$container_id" >&2 || true
            exit 1
          fi
          printf 'PLATFORM_S3_ENDPOINT=http://127.0.0.1:%s\n' "$port" >> "$GITHUB_ENV"
      - name: Wait for MinIO readiness
        run: |
          node --input-type=module -e '
            const deadline = Date.now() + 60000;
            while (Date.now() < deadline) {
              try {
                const response = await fetch(`${process.env.PLATFORM_S3_ENDPOINT}/minio/health/live`);
                if (response.ok) process.exit(0);
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 500));
            }
            throw new Error("MinIO did not become healthy within 60 seconds.");
          '
      - name: PostgreSQL, Redis and S3 integration tests
        run: >-
          node --test
          services/api/test/platform-postgres.integration.test.js
          services/api/test/platform-queue.integration.test.js
          services/api/test/platform-storage.integration.test.js

  smoke:
    name: API smoke (CI job; branch protection pending)
    needs: [test, mobile, platform-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Health and OpenAPI smoke
        shell: bash
        run: |
          set -euo pipefail
          node services/api/src/server.js >/tmp/vision-api-smoke.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health >/tmp/health.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/vision-api-smoke.log
            echo 'API did not become healthy' >&2
            exit 1
          fi
          grep -q '"ok":true' /tmp/health.json
          curl -fsS http://127.0.0.1:4000/api/v1/openapi.json >/tmp/openapi.json
          node -e "const s=require('/tmp/openapi.json'); if (s.openapi !== '3.1.0' || !s.paths['/setup']) process.exit(1)"
          echo 'Health and OpenAPI smoke passed.'

  # The active checks cover the API, web app, and existing Android client's TS sources.
  # Native APK packaging/publication stays on android.yml's explicit tag/manual workflow;
  # desktop/console remain frozen by ADR-0016.
