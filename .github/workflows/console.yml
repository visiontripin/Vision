name: Console (frozen; manual validation only)

# Frozen console/Vision Server experiment (ADR-0016).
# No PR, push, or tag triggers; manual dispatch defaults to notice-only. Set `validate`
# explicitly for an audit build. Release publication is disabled and contents are read-only.

on:
  workflow_dispatch:
    inputs:
      validate:
        description: 'Run a manual audit build for this frozen platform (does not publish a release)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: console-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: 'true'

jobs:
  frozen_notice:
    name: Frozen platform notice
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Console / Vision Server is frozen by ADR-0016; validation is opt-in and release publication is disabled."

  check:
    if: ${{ inputs.validate }}
    name: Панель (типы, тесты, сборка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Типы панели
        run: npx tsc --noEmit -p apps/console
      - name: Тесты чистой логики
        run: npx tsx --test apps/console/src/lib.test.ts
      - name: Сборка панели
        run: npm run build:console
      - name: Guards workflow
        run: npm run test:scripts
      - name: 'API: /admin, настройка владельца и штатная остановка'
        run: node --test services/api/test/console.test.js services/api/test/shutdown.test.js services/api/test/owner-setup.test.js

  windows:
    if: ${{ inputs.validate }}
    name: Windows (NSIS installer + service test)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/console/src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Сборка установщика
        shell: bash
        run: |
          set -o pipefail
          if ! (cd apps/console && npm run build:windows) > build.log 2>&1; then
            echo "::error::Сборка Tauri упала — ниже строки с ошибкой"
            grep -iE "error(\[[A-Za-z0-9]+\])?:|panicked|could not|failed to" build.log \
              | head -25 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -n 30 build.log
            exit 1
          fi
          tail -n 8 build.log
      - name: Проверить включённый серверный runtime
        shell: pwsh
        run: |
          $required = @(
            'apps/console/src-tauri/resources/node/node.exe',
            'apps/console/src-tauri/resources/server/services/api/src/start.js',
            'apps/console/src-tauri/resources/server/apps/console/dist/index.html',
            'apps/console/src-tauri/resources/server/bin/ffmpeg.exe',
            'apps/console/src-tauri/resources/server/service/VisionServer.exe',
            'apps/console/src-tauri/resources/server/service/VisionServer.exe.config',
            'apps/console/src-tauri/resources/server/service/VisionServer.xml'
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Не найден ресурс установщика: $path" }
          }
          $nodeVersion = & apps/console/src-tauri/resources/node/node.exe --version
          if ($nodeVersion -ne 'v24.22.3') { throw "Ожидался Node v24.22.3, получен $nodeVersion" }
          $ffmpegVersion = & apps/console/src-tauri/resources/server/bin/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0 -or $ffmpegVersion -notmatch '^ffmpeg version') { throw 'Не удалось запустить упакованный ffmpeg.exe' }
          Write-Host "Installer resources verified: Node $nodeVersion, API, admin UI, FFmpeg and WinSW"
      - name: Установить и проверить Windows-службу
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'apps/console/src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'NSIS setup.exe was not produced' }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/D=C:\VisionServerTest') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer exited with $($install.ExitCode)" }

          $service = Get-Service -Name 'VisionServer' -ErrorAction Stop
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $service.Refresh()
            if ($service.Status -eq 'Running') { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if ($service.Status -ne 'Running') { throw "VisionServer did not start; state=$($service.Status)" }

          $nativeService = Get-CimInstance Win32_Service -Filter "Name='VisionServer'"
          if ($nativeService.StartMode -ne 'Auto') { throw "Service must start at boot; StartMode=$($nativeService.StartMode)" }
          $serviceSddl = (sc.exe sdshow VisionServer | Out-String)
          if ($serviceSddl -notmatch 'LCRPWP;;;BU') { throw 'Built-in Users cannot query/start/stop the managed service' }

          $health = $null
          $deadline = (Get-Date).AddSeconds(60)
          do {
            try { $health = Invoke-RestMethod 'http://127.0.0.1:4000/api/health' -TimeoutSec 5; break }
            catch { Start-Sleep -Seconds 1 }
          } while ((Get-Date) -lt $deadline)
          if (!$health.ok) { throw 'Packaged Vision API did not become healthy on port 4000' }
          if (!$health.ffmpeg.available) { throw 'Packaged API cannot launch the bundled FFmpeg binary' }
          if ($health.runtime.node -ne 'v24.22.3') { throw "Packaged API used unexpected Node $($health.runtime.node)" }

          $setup = Invoke-RestMethod 'http://127.0.0.1:4000/api/setup'
          if ($setup.configured) { throw 'Fresh service should require a one-time owner password setup' }
          $ownerPassword = 'CI-Vision-' + [guid]::NewGuid().ToString('N')
          $body = @{ password = $ownerPassword } | ConvertTo-Json -Compress
          $rejected = Invoke-WebRequest -Method Post -Uri 'http://127.0.0.1:4000/api/setup' -Headers @{ Origin = 'https://attacker.example' } -ContentType 'application/json' -Body $body -SkipHttpErrorCheck
          if ($rejected.StatusCode -ne 403) { throw 'Cross-site owner-password setup was not rejected' }
          Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:4000/api/setup' -ContentType 'application/json' -Body $body | Out-Null
          $loginBody = @{ password = $ownerPassword } | ConvertTo-Json -Compress
          $login = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:4000/api/auth/login' -ContentType 'application/json' -Body $loginBody
          if (!$login.token) { throw 'Owner login failed after first-run setup' }
          $authFile = Join-Path $env:ProgramData 'VisionServer\data\owner-auth.json'
          $storedAuth = Get-Content -Raw $authFile
          if ($storedAuth.Contains($ownerPassword)) { throw 'Owner password was stored in plaintext' }

          sc.exe stop VisionServer | Out-Null
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $service.Refresh()
            if ($service.Status -eq 'Stopped') { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if ($service.Status -ne 'Stopped') { throw 'VisionServer did not stop through SCM' }
          sc.exe start VisionServer | Out-Null
          $deadline = (Get-Date).AddSeconds(60)
          do {
            try {
              $me = Invoke-RestMethod 'http://127.0.0.1:4000/api/me' -Headers @{ Authorization = "Bearer $($login.token)" } -TimeoutSec 5
              break
            } catch { Start-Sleep -Seconds 1 }
          } while ((Get-Date) -lt $deadline)
          if (!$me.ok) { throw 'Owner session or API did not survive service restart' }
          Write-Host 'Windows installer, boot-start service, bundled API/FFmpeg, first-run setup, SCM stop/start and owner session all passed.'
      - name: Артефакт NSIS
        run: |
          Get-ChildItem apps/console/src-tauri/target/release/bundle/nsis -Filter *.exe |
            Select-Object FullName,Length
      - uses: actions/upload-artifact@v4
        with:
          name: vision-server-windows
          if-no-files-found: error
          path: apps/console/src-tauri/target/release/bundle/nsis/*.exe
      - name: Release (только по тегу console-v*)
        if: false
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Vision Server ${tag#console-}" \
            --notes "Vision Server для Windows: per-machine NSIS-установщик, собственная служба с автозапуском Windows и API/админ-панелью. Android APK остаётся клиентом внешнего API; веб-панель также открывается по адресу /admin."
          files=()
          for f in apps/console/src-tauri/target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] && files+=("$f")
          done
          [ ${#files[@]} -gt 0 ] || { echo "::error::нечего публиковать"; exit 1; }
          gh release upload "$tag" --clobber "${files[@]}"
          gh release view "$tag" --json assets --jq '.assets[] | "asset: \(.name) \(.size) байт"'

  android:
    if: ${{ inputs.validate }}
    name: Android APK
    runs-on: ubuntu-latest
    # APK — отдельный канал поставки: пока Tauri-оболочка обкатывается, падение
    # android-джобы не должно выглядеть как «сломан PR». Ошибки видны в артефактах.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/console/src-tauri
      # SDK уже есть в ubuntu-latest (ANDROID_HOME/ANDROID_SDK_ROOT): ставим только NDK
      - name: Android SDK и NDK
        run: |
          # sdkmanager не в PATH до вызова — берём по полному пути и только
          # потом добавляем каталог в PATH для следующих шагов
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BIN="$SDK/cmdline-tools/latest/bin"
          test -x "$BIN/sdkmanager" || BIN="$SDK/cmdline-tools/bin"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$BIN" >> "$GITHUB_PATH"
          yes | "$BIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$BIN/sdkmanager" --install "ndk;27.0.12077973" "platform-tools" > /dev/null
          echo "NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
      # Диагностика: без неё причина падения не видна (логи Actions закрыты)
      - name: Окружение Android
        shell: bash
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-не задан}"
          java -version 2>&1 | head -3 || true
          echo "NDK: $(ls -d "$NDK_HOME" 2>/dev/null || echo нет)"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true
          npx --no-install tauri --version || true
      - run: npm ci --no-audit --no-fund
      - name: Инициализация Android-проекта
        shell: bash
        run: |
          set -o pipefail
          if ! (cd apps/console && npx tauri android init --ci) > init.log 2>&1; then
            echo "::error::tauri android init упал"
            tail -n 25 init.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      # Release-APK без signingConfig остаётся неподписанным, и Android отказывается
      # его ставить («пакет недействителен»). Подключаем тот же ключ, что у мобильного.
      - name: Подпись APK
        shell: bash
        env:
          VISION_KEYSTORE_PASSWORD: vision-audio
          VISION_KEY_ALIAS: vision
          VISION_KEY_PASSWORD: vision-audio
        run: |
          # Логи job-а в этой среде не скачать, поэтому всё важное дублируем
          # аннотациями: они видны на странице PR.
          echo "::warning title=gen::$(ls -d apps/console/src-tauri/gen/android 2>/dev/null || echo 'нет каталога gen/android')"
          # Файл Gradle может быть в разных местах в зависимости от версии CLI —
          # показываем все найденные, чтобы не угадывать.
          find apps/console/src-tauri/gen -name "build.gradle*" 2>/dev/null | head -10 \
            | while IFS= read -r f; do echo "::warning title=gradle::$f"; done
          echo "::warning title=key::$(ls apps/mobile/vision-release.p12 2>/dev/null || echo 'ключ не найден')"
          if ! node scripts/android-sign-console.mjs > /tmp/sign.log 2>&1; then
            tail -n 20 /tmp/sign.log | while IFS= read -r line; do echo "::error title=sign::$line"; done
            exit 1
          fi
          while IFS= read -r line; do echo "::notice title=sign::$line"; done < /tmp/sign.log
      - name: Сборка APK
        shell: bash
        run: |
          set -o pipefail
          if ! (cd apps/console && npx tauri android build --apk --ci) > build.log 2>&1; then
            echo "::error::tauri android build упал"
            hits=$(grep -iE "error(\[[A-Za-z0-9]+\])?:|panicked|could not|failed to|Exception|not found" build.log \
              | head -20 || true)
            # если шаблон ничего не поймал — показываем хвост лога как аннотации
            [ -n "$hits" ] || hits=$(tail -n 20 build.log)
            printf '%s\n' "$hits" | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      # Та же проверка, что у мобильного APK: без неё неподписанная сборка
      # уезжает в релиз «зелёной» и падает уже на телефоне.
      - name: Проверка APK
        shell: bash
        run: |
          set -uo pipefail
          APK=$(find apps/console/src-tauri/gen/android -name "*.apk" -path "*release*" | head -1)
          [ -n "$APK" ] || APK=$(find apps/console/src-tauri/gen/android -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::APK не найден"
            exit 1
          fi
          echo "::warning title=apk::$(basename "$APK"), $(du -h "$APK" | cut -f1)"
          BT=$(ls -d "${ANDROID_HOME:?}"/build-tools/* | sort -V | tail -1)
          if ! "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/verify.txt 2>&1; then
            tail -n 20 /tmp/verify.txt
            echo "::error title=apk::apksigner verify не прошёл — пакет не установится"
            exit 1
          fi
          while IFS= read -r l; do echo "::warning title=apk-подпись::$l"; done \
            < <(grep -E "^(Verifies|Verified using)" /tmp/verify.txt || true)
          if "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt 2>&1; then
            while IFS= read -r l; do echo "::warning title=apk-badging::$l"; done \
              < <(grep -E "^(package|sdkVersion|targetSdkVersion)" /tmp/badging.txt || true)
          fi
          # «Unsigned» в release-сборке — это и есть та самая ошибка установки
          if grep -qiE "does not verify|no signature|unsigned" /tmp/verify.txt; then
            echo "::error title=apk::APK не подписан"
            exit 1
          fi

      - name: Имя APK и SHA-256
        shell: bash
        id: apk
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/console/src-tauri/tauri.conf.json').version")
          APK=$(find apps/console/src-tauri/gen/android -name "*.apk" -path "*release*" | head -1)
          [ -n "$APK" ] || APK=$(find apps/console/src-tauri/gen/android -name "*.apk" | head -1)
          NAME="VisionServer-${VERSION}-android.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          cp "$NAME" VisionServer-latest.apk
          ls -lh "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### Vision Server ${VERSION} — Android APK"
            echo ""
            echo "- файл: \`${NAME}\` (подписан, ставится на телефон)"
            echo "- постоянная ссылка: \`VisionServer-latest.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: vision-server-android
          if-no-files-found: error
          path: |
            VisionServer-*.apk
            VisionServer-*.apk.sha256
      - name: Release APK (только по тегу console-v*)
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Vision Server ${tag#console-}" \
            --notes "Приложение запуска и админки Vision Audio для Windows и Android."
          NAME='${{ steps.apk.outputs.name }}'
          gh release upload "$tag" "$NAME" "$NAME.sha256" VisionServer-latest.apk --clobber
          echo "::notice::опубликован $NAME и VisionServer-latest.apk"
