name: Console (Windows + Android)

# Отдельное приложение «Vision Server»: запуск и админка.
#   - ubuntu: типы, тесты и сборка панели (дешёвая проверка на каждом PR);
#   - windows-latest: Tauri-установщик .msi/.exe (NSIS);
#   - android: Tauri 2 APK (Rust + NDK) в отдельной джобе, не блокирует PR.
#
#   git tag console-v0.1.0 && git push origin console-v0.1.0 → GitHub Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/console/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/console.yml'
  push:
    tags:
      - 'console-v*'

permissions:
  contents: write

concurrency:
  group: console-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: 'true'

jobs:
  check:
    name: Панель (типы, тесты, сборка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Типы панели
        run: npx tsc --noEmit -p apps/console
      - name: Тесты чистой логики
        run: npx tsx --test apps/console/src/lib.test.ts
      - name: Сборка панели
        run: npm run build:console
      - name: Сервер отдаёт /admin
        run: node --test services/api/test/console.test.js

  windows:
    name: Windows (.msi + .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/console/src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Сборка установщика
        shell: bash
        run: |
          set -o pipefail
          if ! (cd apps/console && npm run build:windows) > build.log 2>&1; then
            echo "::error::Сборка Tauri упала — ниже строки с ошибкой"
            grep -iE "error(\[[A-Za-z0-9]+\])?:|panicked|could not|failed to" build.log \
              | head -25 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -n 30 build.log
            exit 1
          fi
          tail -n 8 build.log
      - name: Артефакты
        run: |
          Get-ChildItem apps/console/src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe |
            Select-Object FullName,Length
      - uses: actions/upload-artifact@v4
        with:
          name: vision-server-windows
          if-no-files-found: error
          path: |
            apps/console/src-tauri/target/release/bundle/msi/*.msi
            apps/console/src-tauri/target/release/bundle/nsis/*.exe
      - name: Release (только по тегу console-v*)
        if: startsWith(github.ref, 'refs/tags/console-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Vision Server ${tag#console-}" \
            --notes "Приложение запуска и админки Vision Audio: Windows-установщик и APK для Android. Панель также открывается на самом сервере по адресу /admin."
          # Явный список вместо шаблонов: если .exe не собрался (NSIS капризен к
          # разметке на кириллице), публикуем хотя бы .msi, а не роняем релиз.
          files=()
          for f in apps/console/src-tauri/target/release/bundle/msi/*.msi \
                   apps/console/src-tauri/target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] && files+=("$f")
          done
          [ ${#files[@]} -gt 0 ] || { echo "::error::нечего публиковать"; exit 1; }
          gh release upload "$tag" --clobber "${files[@]}"
          gh release view "$tag" --json assets --jq '.assets[] | "asset: \(.name) \(.size) байт"'

  android:
    name: Android APK
    runs-on: ubuntu-latest
    # APK — отдельный канал поставки: пока Tauri-оболочка обкатывается, падение
    # android-джобы не должно выглядеть как «сломан PR». Ошибки видны в артефактах.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/console/src-tauri
      # SDK уже есть в ubuntu-latest (ANDROID_HOME/ANDROID_SDK_ROOT): ставим только NDK
      - name: Android SDK и NDK
        run: |
          # sdkmanager не в PATH до вызова — берём по полному пути и только
          # потом добавляем каталог в PATH для следующих шагов
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BIN="$SDK/cmdline-tools/latest/bin"
          test -x "$BIN/sdkmanager" || BIN="$SDK/cmdline-tools/bin"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$BIN" >> "$GITHUB_PATH"
          yes | "$BIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$BIN/sdkmanager" --install "ndk;27.0.12077973" "platform-tools" > /dev/null
          echo "NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
      # Диагностика: без неё причина падения не видна (логи Actions закрыты)
      - name: Окружение Android
        shell: bash
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-не задан}"
          java -version 2>&1 | head -3 || true
          echo "NDK: $(ls -d "$NDK_HOME" 2>/dev/null || echo нет)"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true
          npx --no-install tauri --version || true
      - run: npm ci --no-audit --no-fund
      - name: Инициализация Android-проекта
        shell: bash
        run: |
          set -o pipefail
          if ! (cd apps/console && npx tauri android init --ci) > init.log 2>&1; then
            echo "::error::tauri android init упал"
            tail -n 25 init.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      # Release-APK без signingConfig остаётся неподписанным, и Android отказывается
      # его ставить («пакет недействителен»). Подключаем тот же ключ, что у мобильного.
      - name: Подпись APK
        shell: bash
        env:
          VISION_KEYSTORE_PASSWORD: vision-audio
          VISION_KEY_ALIAS: vision
          VISION_KEY_PASSWORD: vision-audio
        run: |
          # Логи job-а в этой среде не скачать, поэтому всё важное дублируем
          # аннотациями: они видны на странице PR.
          echo "::warning title=gen::$(ls -d apps/console/src-tauri/gen/android 2>/dev/null || echo 'нет каталога gen/android')"
          # Файл Gradle может быть в разных местах в зависимости от версии CLI —
          # показываем все найденные, чтобы не угадывать.
          find apps/console/src-tauri/gen -name "build.gradle*" 2>/dev/null | head -10 \
            | while IFS= read -r f; do echo "::warning title=gradle::$f"; done
          echo "::warning title=key::$(ls apps/mobile/vision-release.p12 2>/dev/null || echo 'ключ не найден')"
          if ! node scripts/android-sign-console.mjs > /tmp/sign.log 2>&1; then
            tail -n 20 /tmp/sign.log | while IFS= read -r line; do echo "::error title=sign::$line"; done
            exit 1
          fi
          while IFS= read -r line; do echo "::notice title=sign::$line"; done < /tmp/sign.log
      - name: Сборка APK
        shell: bash
        run: |
          set -o pipefail
          if ! (cd apps/console && npx tauri android build --apk --ci) > build.log 2>&1; then
            echo "::error::tauri android build упал"
            hits=$(grep -iE "error(\[[A-Za-z0-9]+\])?:|panicked|could not|failed to|Exception|not found" build.log \
              | head -20 || true)
            # если шаблон ничего не поймал — показываем хвост лога как аннотации
            [ -n "$hits" ] || hits=$(tail -n 20 build.log)
            printf '%s\n' "$hits" | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      # Та же проверка, что у мобильного APK: без неё неподписанная сборка
      # уезжает в релиз «зелёной» и падает уже на телефоне.
      - name: Проверка APK
        shell: bash
        run: |
          set -uo pipefail
          APK=$(find apps/console/src-tauri/gen/android -name "*.apk" -path "*release*" | head -1)
          [ -n "$APK" ] || APK=$(find apps/console/src-tauri/gen/android -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::APK не найден"
            exit 1
          fi
          echo "::warning title=apk::$(basename "$APK"), $(du -h "$APK" | cut -f1)"
          BT=$(ls -d "${ANDROID_HOME:?}"/build-tools/* | sort -V | tail -1)
          if ! "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/verify.txt 2>&1; then
            tail -n 20 /tmp/verify.txt
            echo "::error title=apk::apksigner verify не прошёл — пакет не установится"
            exit 1
          fi
          while IFS= read -r l; do echo "::warning title=apk-подпись::$l"; done \
            < <(grep -E "^(Verifies|Verified using)" /tmp/verify.txt || true)
          if "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt 2>&1; then
            while IFS= read -r l; do echo "::warning title=apk-badging::$l"; done \
              < <(grep -E "^(package|sdkVersion|targetSdkVersion)" /tmp/badging.txt || true)
          fi
          # «Unsigned» в release-сборке — это и есть та самая ошибка установки
          if grep -qiE "does not verify|no signature|unsigned" /tmp/verify.txt; then
            echo "::error title=apk::APK не подписан"
            exit 1
          fi

      - name: Имя APK и SHA-256
        shell: bash
        id: apk
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/console/src-tauri/tauri.conf.json').version")
          APK=$(find apps/console/src-tauri/gen/android -name "*.apk" -path "*release*" | head -1)
          [ -n "$APK" ] || APK=$(find apps/console/src-tauri/gen/android -name "*.apk" | head -1)
          NAME="VisionServer-${VERSION}-android.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          cp "$NAME" VisionServer-latest.apk
          ls -lh "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### Vision Server ${VERSION} — Android APK"
            echo ""
            echo "- файл: \`${NAME}\` (подписан, ставится на телефон)"
            echo "- постоянная ссылка: \`VisionServer-latest.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: vision-server-android
          if-no-files-found: error
          path: |
            VisionServer-*.apk
            VisionServer-*.apk.sha256
      - name: Release APK (только по тегу console-v*)
        if: startsWith(github.ref, 'refs/tags/console-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Vision Server ${tag#console-}" \
            --notes "Приложение запуска и админки Vision Audio для Windows и Android."
          NAME='${{ steps.apk.outputs.name }}'
          gh release upload "$tag" "$NAME" "$NAME.sha256" VisionServer-latest.apk --clobber
          echo "::notice::опубликован $NAME и VisionServer-latest.apk"
