name: Android APK

# Собирает подписанный .apk и (по умолчанию) выкладывает его в GitHub Release —
# оттуда получается постоянная прямая ссылка для установки на телефон.
#
#   Actions → Android APK → Run workflow        (release = true: создать Release)
#   git tag android-v0.2.0 && git push origin android-v0.2.0

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Создать GitHub Release с APK'
        type: boolean
        default: true
      embedded:
        description: 'Встроить Node-рантайм (сервер на телефоне)'
        type: boolean
        default: true
      tester:
        description: 'Собрать отдельный тестовый APK (VisionTester)'
        type: boolean
        default: false
  push:
    tags:
      - 'android-v*'
      # тестовый APK: push тега tester-v* собирает только job tester
      - 'tester-v*'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'
  CI: '1'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'

jobs:
  apk:
    name: assembleRelease
    # тег tester-v* — это только тестовая сборка, релизный APK не пересобираем
    if: ${{ !startsWith(github.ref, 'refs/tags/tester-v') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}

      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Типы
        run: npx tsc --noEmit

      - name: Android SDK и лицензии
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Нативный проект (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Подпись и версия
        run: node ../../scripts/android-prepare.mjs

      # Важно: при push тега `inputs` вообще нет (это null, а `null != false` в
      # выражениях GitHub — ложь). Поэтому условие «не выключено явно» пишется как
      # `event != workflow_dispatch || inputs.embedded`, иначе релизный APK молча
      # собирался без Node.
      # Node-рантайм ~90 МБ: кэш по версии из node-version.json, чтобы не качать
      # его на каждой сборке. Ключ меняется только при смене версии Node.
      - name: Кэш Node-рантайма
        id: node-cache
        if: github.event_name != 'workflow_dispatch' || inputs.embedded
        uses: actions/cache@v4
        with:
          path: apps/mobile/nodejs/android/libnode
          key: nodejs-mobile-${{ hashFiles('apps/mobile/nodejs/android/node-version.json') }}

      - name: Node-рантайм для встроенного сервера
        if: github.event_name != 'workflow_dispatch' || inputs.embedded
        run: node ../../scripts/fetch-nodejs-mobile.mjs

      - name: Встроить сервер в проект
        if: github.event_name != 'workflow_dispatch' || inputs.embedded
        run: |
          node ../../scripts/android-embed-node.mjs
          # Проверка настроек в одном месте: если Node не попал в APK, это должно
          # быть видно строкой в логе, а не догадкой по размеру файла.
          grep -E '^reactNativeArchitectures=' android/gradle.properties \
            | while IFS= read -r line; do echo "::warning title=embedded::$line"; done
          ls -1 apps/mobile/nodejs/android/libnode/bin 2>/dev/null | tr '\n' ' ' \
            | while IFS= read -r line; do echo "::warning title=embedded::libnode ABI: $line"; done

      - name: Проверить встроенный сервер
        if: github.event_name != 'workflow_dispatch' || inputs.embedded
        run: node ../../scripts/android-embed-node.mjs --check

      - name: Окружение
        run: |
          java -version 2>&1 | head -2 | while IFS= read -r l; do echo "::warning title=java::$l"; done
          echo "::warning title=sdk::ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ' | while IFS= read -r l; do echo "::warning title=platforms::$l"; done
          ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ' | while IFS= read -r l; do echo "::warning title=build-tools::$l"; done
          grep -E "versionCode|versionName|visionRelease|storeType" android/app/build.gradle | head -12 | while IFS= read -r l; do echo "::warning title=gradle::$l"; done
          ls -l vision-release.p12

      - name: Сборка APK
        run: |
          set -o pipefail
          cd android
          if ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log; then
            exit 0
          fi
          # хвост лога в аннотации: логи job-а скачивать не всегда возможно
          grep -nE "What went wrong|FAILURE:|Caused by:|error:|Execution failed|Could not|not found|No such file" /tmp/gradle.log | tail -25 \
            | while IFS= read -r line; do echo "::error title=gradle-причина::$line"; done
          tail -n 40 /tmp/gradle.log | while IFS= read -r line; do echo "::error title=gradle-хвост::$line"; done
          exit 1

      - name: Проверка APK
        run: |
          set -uo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "::warning title=apk::размер $(du -h "$APK" | cut -f1), build-tools $(basename "$BT")"

          if ! "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/verify.txt 2>&1; then
            tail -n 20 /tmp/verify.txt
            echo "::error title=apk::apksigner verify не прошёл"
            exit 1
          fi
          while IFS= read -r l; do echo "::warning title=apk-подпись::$l"; done < <(grep -E "^(Verifies|Verified using)" /tmp/verify.txt || true)
          while IFS= read -r l; do echo "::warning title=apk-сертификат::$l"; done < <(grep -E "Signer #1 certificate" /tmp/verify.txt || true)

          if "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt 2>&1; then
            while IFS= read -r l; do echo "::warning title=apk-badging::$l"; done < <(grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" /tmp/badging.txt || true)
          else
            while IFS= read -r l; do echo "::warning title=apk-badging-ошибка::$l"; done < <(tail -n 5 /tmp/badging.txt)
          fi

          # Встроенный сервер: .so под каждый ABI и скрипт в assets. Без этого APK
          # соберётся, но кнопка «Запустить сервер» скажет «нет рантайма» — лучше
          # узнать это в CI, чем на телефоне.
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libvisionnode.so"; then
            # ABI берём из проекта: по умолчанию собирается только arm64-v8a
            # (каждый ABI добавляет ~60 МБ libnode.so)
            ABIS=$(grep -E '^reactNativeArchitectures=' android/gradle.properties | cut -d= -f2 | tr ',' ' ')
            [ -n "$ABIS" ] || { echo "::error title=apk::в gradle.properties нет reactNativeArchitectures"; exit 1; }
            echo "::warning title=apk::ABI в сборке: $ABIS"
            for abi in $ABIS; do
              unzip -l "$APK" | grep -q "lib/$abi/libnode.so" \
                || { echo "::error title=apk::нет libnode.so для $abi"; exit 1; }
            done
            unzip -l "$APK" | grep -q "assets/nodejs-project/bootstrap.mjs" \
              || { echo "::error title=apk::нет bootstrap.mjs в assets"; exit 1; }
            echo "::warning title=apk::встроенный сервер в APK (libvisionnode.so + libnode.so ×3 + bootstrap.mjs)"
          else
            echo "::warning title=apk::сборка БЕЗ встроенного Node (сервер на телефоне недоступен)"
          fi

          if unzip -l "$APK" | grep -q "index.android.bundle"; then
            echo "::warning title=apk::JS-бандл на месте"
          else
            echo "::error title=apk::в APK нет index.android.bundle"
            exit 1
          fi

      - name: APK, размер и SHA-256
        id: apk
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="VisionAudio-${VERSION}-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$NAME"
          cd "$GITHUB_WORKSPACE"
          sha256sum "$NAME" | tee "$NAME.sha256"
          # постоянная ссылка: имя файла не зависит от версии
          cp "$NAME" VisionAudio-latest.apk
          SIZE=$(du -h "$NAME" | cut -f1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          {
            echo "### Vision Audio ${VERSION} — Android APK"
            echo ""
            echo "- файл: \`${NAME}\` (${SIZE})"
            echo "- постоянная ссылка: \`VisionAudio-latest.apk\`"
            echo "- versionCode: ${GITHUB_RUN_NUMBER}"
            echo "- установка: скачать APK на телефон → «Установить из неизвестного источника»"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: vision-audio-apk
          path: |
            VisionAudio-*.apk
            VisionAudio-*.apk.sha256
          retention-days: 90

      - name: Публикация Release
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          NAME='${{ steps.apk.outputs.name }}'
          VERSION='${{ steps.apk.outputs.version }}'
          TAG="android-v${VERSION}"
          NOTES=$(cat <<EOF
          Готовый установочный файл мобильного приложения Vision Audio ${VERSION}.

          ## Установка

          1. Скачайте \`${NAME}\` на телефон (Android 7.0+, minSdk 24).
          2. Откройте файл и разрешите установку из этого источника.
             Постоянная ссылка на актуальную сборку (без версии в имени):
             \`https://github.com/visiontripin/Vision/releases/latest/download/VisionAudio-latest.apk\`
          3. В приложении укажите адрес сервера, например \`http://192.168.1.10:4000\`
             (или ваш Tailscale / Cloudflare-адрес) и войдите паролем \`vision\`.

          ## Проверка целостности

          Рядом лежит \`${NAME}.sha256\`; размер файла — ${{ steps.apk.outputs.size }}.

          ## Обновления

          Пакет \`app.vision.audio\`, versionCode ${GITHUB_RUN_NUMBER}. Новая сборка ставится
          поверх предыдущей — настройки, вход и скачанные треки сохраняются. Ключ подписи
          постоянный (см. docs/ANDROID.md), поэтому переустанавливать приложение не нужно.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME" "$NAME.sha256" VisionAudio-latest.apk --clobber
            gh release edit "$TAG" --notes "$NOTES" 
          else
            gh release create "$TAG" "$NAME" "$NAME.sha256" VisionAudio-latest.apk \
              --target "$GITHUB_SHA" \
              --title "Vision Audio ${VERSION} — Android APK" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets --jq '"release: \(.url)", (.assets[] | "asset: \(.name) \(.size) байт → \(.url)")'

  # Отдельный тестовый APK: другой applicationId, поэтому ставится рядом с
  # обычным приложением, а не поверх него — удобно проверять новые сборки, не
  # трогая свою библиотеку и вход.
  #
  # Внутри: тестер API (адрес + шесть проверок), состояние встроенного сервера и
  # быстрый доступ к логам Node. Запускается из Actions → Run workflow с
  # включённым «Собрать отдельный тестовый APK».
  tester:
    name: VisionTester APK
    # либо вручную с включённым input, либо тегом tester-v*: workflow_dispatch из
    # другого workflow не вызвать, а тестовый APK нужен по расписанию релиза
    if: inputs.tester == true || startsWith(github.ref, 'refs/tags/tester-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-tester-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}

      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Android SDK и лицензии
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Параметры тестовой сборки
        run: node ../../scripts/android-tester-app.mjs

      - name: Нативный проект (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Подпись и версия
        run: node ../../scripts/android-prepare.mjs

      - name: Кэш Node-рантайма
        id: node-cache
        uses: actions/cache@v4
        with:
          path: apps/mobile/nodejs/android/libnode
          key: nodejs-mobile-${{ hashFiles('apps/mobile/nodejs/android/node-version.json') }}

      - name: Node-рантайм для встроенного сервера
        run: node ../../scripts/fetch-nodejs-mobile.mjs

      - name: Встроить сервер в проект
        if: github.event_name != 'workflow_dispatch' || inputs.embedded
        run: |
          node ../../scripts/android-embed-node.mjs
          # Проверка настроек в одном месте: если Node не попал в APK, это должно
          # быть видно строкой в логе, а не догадкой по размеру файла.
          grep -E '^reactNativeArchitectures=' android/gradle.properties \
            | while IFS= read -r line; do echo "::warning title=embedded::$line"; done
          ls -1 apps/mobile/nodejs/android/libnode/bin 2>/dev/null | tr '\n' ' ' \
            | while IFS= read -r line; do echo "::warning title=embedded::libnode ABI: $line"; done

      - name: Сборка APK
        run: |
          set -o pipefail
          cd android
          if ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log; then
            exit 0
          fi
          grep -nE "What went wrong|FAILURE:|Caused by:|error:|Execution failed" /tmp/gradle.log | tail -25 \
            | while IFS= read -r line; do echo "::error title=gradle-причина::$line"; done
          exit 1

      - name: Проверка тестового APK
        run: |
          set -uo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt 2>&1 || true
          grep -E "^package:" /tmp/badging.txt | while IFS= read -r l; do echo "::warning title=tester::$l"; done
          grep -q "app.vision.audio.tester" /tmp/badging.txt \
            || { echo "::error title=tester::applicationId не app.vision.audio.tester — APK перезапишет основное приложение"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libvisionnode.so" \
            || { echo "::error title=tester::нет встроенного Node"; exit 1; }
          unzip -l "$APK" | grep -q "assets/nodejs-project/bootstrap.mjs" \
            || { echo "::error title=tester::нет bootstrap.mjs"; exit 1; }
          echo "::warning title=tester::тестовый APK содержит Node и bootstrap"

      - name: Имя файла и SHA-256
        id: apk
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="VisionTester-${VERSION}-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$NAME"
          cd "$GITHUB_WORKSPACE"
          sha256sum "$NAME" | tee "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: vision-tester-apk
          path: |
            VisionTester-*.apk
            VisionTester-*.apk.sha256
          retention-days: 30

      - name: Публикация (тег tester-v*)
        if: startsWith(github.ref, 'refs/tags/tester-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          NAME='${{ steps.apk.outputs.name }}'
          TAG="tester-v${{ steps.apk.outputs.version }}"
          NOTES="Тестовый APK Vision Audio $NAME.

          Ставится рядом с обычным приложением (applicationId app.vision.audio.tester),
          содержит встроенный Node и тестер API: адрес сервера, шесть проверок
          (health, список, загрузка, скачивание, Range, удаление) и отчёт, которым
          можно поделиться."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME" "$NAME.sha256" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$NAME" "$NAME.sha256" --target "$GITHUB_SHA" \
              --title "VisionTester ${{ steps.apk.outputs.version }}" --notes "$NOTES"
          fi
